name: demo
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./... && go test ./...
        working-directory: scanner

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lab credentials
        run: printf 'DB_PASSWORD=%s\nADMIN_USER=brightline\nADMIN_PASSWORD=%s\n' "$(openssl rand -hex 12)" "$(openssl rand -hex 12)" > lab/.env
      - name: Infect, scan, clean, verify
        run: ./demo.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            report/owner-report.html
            report/*/report.md
            report/out/plan.sh
